[package]
name = "spool"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = [ "multipart" ] }
bytes = "1.12.1"
hex = "0.4.3"
infer = "0.22.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
spool-sqlite = { path = "crates/spool-sqlite" }
spool-core = { path = "crates/spool-core" }
serde = "1.0.229"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
mime_guess = "2.0.5"
tower-http = { version = "0.7.1", features = ["trace"] }
dotenvy = "0.15.7"

[workspace]
resolver = "3"
members = [
  "crates/spool-core",
  "crates/spool-postgres",
  "crates/spool-sqlite"
]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
redundant_clone = "warn"
print_stdout = "warn"
print_stderr = "warn"
